limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;

upstream backend_cluster {
    server backend:8000 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10k;

    # API reverse proxy — strips the /api prefix (matches the Vite dev proxy)
    location /api/ {
        limit_req zone=api_limit burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;

        proxy_pass http://backend_cluster/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # OAuth redirects must reach the backend with the path preserved
    location /auth/oauth/ {
        proxy_pass http://backend_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"detail":"Rate limit exceeded: 30 per minute"}';
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}