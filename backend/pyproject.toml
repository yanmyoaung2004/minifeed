[project]
name = "mini-feed-backend"
version = "0.1.0"
description = "MiniFeed API — FastAPI social feed backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pwdlib[argon2]>=0.2.1",
    "PyJWT>=2.9.0",
    "email-validator>=2.2.0",
    "redis>=8.1.0",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.testclient.StarletteDeprecationWarning",
]
